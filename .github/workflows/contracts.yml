name: Contracts
on:
  pull_request:
    paths: ["contracts/**"]
  push:
    branches: [main]
    paths: ["contracts/**"]

jobs:
  evm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts/evm } }
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge install foundry-rs/forge-std --no-git
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  cosmwasm:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts/cosmwasm } }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts/cosmwasm }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release --target wasm32-unknown-unknown
